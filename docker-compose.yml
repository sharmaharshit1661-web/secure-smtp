# ==============================================================================
# Secure SMTP — Production Docker Compose Orchestrator
# ==============================================================================
# Launches the full production stack with 1 command:
#   docker-compose up -d --build
#
# Services:
#   - frontend: React + Vite web console on Nginx (Port 80)
#   - backend:  FastAPI cryptographic assessment API (Port 8000)
#   - mongodb:  MongoDB database with authentication (Port 27017)
#   - redis:    Redis cache and async queue broker (Port 6379)
# ==============================================================================

version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: secure_smtp_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${SECURE_SMTP_MONGO_USER:-secure_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${SECURE_SMTP_MONGO_PASSWORD:-secure_smtp_live_db_key_2026}
      MONGO_INITDB_DATABASE: ${SECURE_SMTP_MONGO_DB:-secure_smtp}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: secure_smtp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: secure_smtp_backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SECURE_SMTP_MONGO_HOST=mongodb
      - SECURE_SMTP_MONGO_PORT=27017
      - SECURE_SMTP_MONGO_DB=secure_smtp
      - SECURE_SMTP_MONGO_USER=${SECURE_SMTP_MONGO_USER:-secure_admin}
      - SECURE_SMTP_MONGO_PASSWORD=${SECURE_SMTP_MONGO_PASSWORD:-secure_smtp_live_db_key_2026}
      - SECURE_SMTP_MONGO_AUTH_DB=admin
      - SECURE_SMTP_MONGO_AUTH_REQUIRED=true
      - SECURE_SMTP_API_KEY=${SECURE_SMTP_API_KEY:-securesmtp_live_secret_key}
      - SECURE_SMTP_AUTH_REQUIRED=true
      - SECURE_SMTP_ALERTS_ENABLED=${SECURE_SMTP_ALERTS_ENABLED:-false}
      - SECURE_SMTP_ALERT_WEBHOOK_URL=${SECURE_SMTP_ALERT_WEBHOOK_URL:-}
    ports:
      - "8000:8000"
    volumes:
      - app_uploads:/tmp/secure_smtp_uploads
      - app_reports:/tmp/secure_smtp_reports

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: secure_smtp_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mongodb_data:
  redis_data:
  app_uploads:
  app_reports:
