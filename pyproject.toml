[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-smtp"
version = "0.1.0"
description = "AI-Assisted Cryptographic Security Posture Assessment for Secure Email Communications"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Harshit Sharma"},
]

dependencies = [
    # Stage 1-3: PCAP parsing, TCP reassembly, TLS/cert parsing
    "scapy>=2.5.0",
    "cryptography>=41.0",

    # Stage 4: Rule engine
    "pyyaml>=6.0",

    # Stage 5: AI/ML
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "shap>=0.43",
    "numpy>=1.24",
    "pandas>=2.0",

    # Stage 6: API & Reporting
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "python-multipart>=0.0.6",
    "weasyprint>=60.0",
    "reportlab>=4.0",
    "jinja2>=3.1",

    # Database
    "pymongo>=4.6.0",

    # Utilities
    "httpx>=0.25",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]
llm = [
    "anthropic>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "E402", "UP042"]

